name = "burgenton-mail"
main = "src/index.js"
compatibility_date = "2026-08-17"

[vars]
# Both point at a test inbox for now. Once burgenton.com's real
# mailboxes are ready, update these (or run `wrangler deploy` after
# editing) to sales@burgenton.com / info@burgenton.com.
SALES_EMAIL = "okoobohefosa@gmail.com"
INFO_EMAIL = "okoobohefosa@gmail.com"

# Resend's shared sandbox sender — works without domain verification,
# but only reliably delivers to the address that owns the Resend account.
# Once burgenton.com is verified in Resend, switch this to something like
# "Burgenton Website <no-reply@burgenton.com>".
FROM_EMAIL = "Burgenton Website <onboarding@resend.dev>"

# Comma-separated list of origins allowed to call this worker.
# Add the real production domain(s) once the site is deployed.
ALLOWED_ORIGINS = "https://burgenton.com,https://www.burgenton.com,http://localhost:8000,http://127.0.0.1:8000,http://localhost:5500,http://127.0.0.1:5500"

# RESEND_API_KEY is a secret, not a var — set it with:
#   wrangler secret put RESEND_API_KEY
